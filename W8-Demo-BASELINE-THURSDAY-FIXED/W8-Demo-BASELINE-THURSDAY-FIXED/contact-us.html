			//when user click "bigger" buton make vidio width set to 560
			//when user click SMALLER buttion make cidio set to 320

		<div>
			<h1>FIND US AT: EIT, 501 Gloucester St, Taradale, Napier. <h1>
			<div style="text-align: center;">
				<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3076.5718835299713!2d176.8348112759682!3d-39.546710871592616!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6d69b41600f98c3f%3A0xb76385bc57ba6049!2s501%20Gloucester%20Street%2C%20Taradale%2C%20Napier%204112!5e0!3m2!1sen!2snz!4v1756341123034!5m2!1sen!2snz" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

		<div class="container">
		  <hr>
		  <h1>SEND US A MESSAGE: </h1>
		  <form class="contact-form">
			  <div class="row">
				<div class="col-25">
				  <label for="fname">First Name</label>
				</div>
				<div class="col-75">
				  <input type="text" id="fname" name="firstname" placeholder="Your name..">
				</div>
			  </div>
			  
			  <div class="row">
				<div class="col-25">
				  <label for="lname">Last Name</label>
				</div>
				<div class="col-75">
				  <input type="text" id="lname" name="lastname" placeholder="Your last name..">
				</div>
			  </div>

			  <div class="row">
				<div class="col-25">
				  <label for="email">Email</label>
				</div>
				<div class="col-75">
				  <input type="email" id="email" name="email" placeholder="Your email..">
				</div>
			  </div>
			  
			  <div class="row">
				<div class="col-25">
				  <label for="country">City</label>
				</div>
				<div class="col-75">
				  <select id="city" name="city">
					<option value="auckland">Auckland</option>
					<option value="gisborne">Gisborne</option>
					<option value="napier">Napier</option>
				  </select>
				</div>
			  </div>
			  
			  <div class="row">
				<div class="col-25">
				  <label for="subject">Message</label>
				</div>
				<div class="col-75">
				  <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px"></textarea>
				</div>
			  </div>
			  
			  <br>
			  <div class="row">
				<input type="submit" value="Submit">
			  </div>
		  </form>
		</div>
