<!DOCTYPE html>
<html>
<!------------------------------HEAD------------------------------------------------>
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Contact Us</title> 
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<!------------------------------BODY------------------------------------------------>
<body>
    <!--Navigation Section--> 
    <nav>
        <!--Add a sandwich icon here-->
        <div class="sandwich-icon-area">
            <p onclick="openNav()"> &#9776; <span>MY BEAUTIFUL WEBSITE</span> </p>
        </div>       
    </nav>

    <!--The curtain dropdown menu-->
    <div id="myNav" class="overlay">
        <p class="close-icon" onclick="closeNav()"> &times; </p>
        <div class="overlay-content">
            <a href="index.html">HOME</a>
            <a href="contact-us.html">CONTACT US</a>
            <a href="#">WEBPAGE 2</a>
            <a href="#">WEBPAGE 3</a>
        </div>
    </div>

    <script>
        //When users click on "sandwich icon", open or show the curtain menu layer
        function openNav() {
            document.getElementById("myNav").style.display = "block";
        }
        //Write the closeNav() method here
        function closeNav() {
            document.getElementById("myNav").style.display = "none";
        }
    </script>
	
    <!--Header Section--> 
    <header>
        <!--Background Image-->
        <div class="bg-image"></div>
        <!--Text on background Image-->
        <div class="bg-text">
            <h1 style="font-size: 2.0em">I am Daniel DANG</h1>
            <p>And I'm a Website Developer</p>
        </div>
    </header>
    
    <!--Main Section--> 
    <main>
        <h1>ITEM DETAIL PAGE</h1>

        <!--add a dropdown select of languages to translate-->
        <div>
            <h3>Translate this page to:</h3>
            <div id="google_translate_element"></div>
        </div>
        <div id="itemDetailContainer">
            <!-- Selected item detail will be display here -->
        </div>

        <div id="commentContainer">
            <h2>Comments: </h2>
            <!-- Comments will be display here -->
            <div id="allComments"></div>
        </div>

        <div id="commentFormContainer">
            <h2>Add a Comment: </h2>
            <form id="commentForm">
                <label for="name">Name:</label><br>
                <input type="text" id="user" name="user" required><br>
                <label for="comment">Comment:</label><br>
                <textarea id="comment" name="comment" rows="4" cols="50" required></textarea><br>
                <input type="submit" value="Submit">
            </form>
        </div>

    </main>

    <!--Footer Section--> 
    <footer class="vertical-center"> 
        <p>ITWD5.130 Website Development<br> Created by Daniel Dang</p>       
    </footer>

    <script src="item-detail.js"></script>

</body>
</html>
